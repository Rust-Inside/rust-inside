name: Check Rust Inside tools

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          for manifest in annotations/Cargo.toml scripts/sdk/discover/Cargo.toml; do
            cargo +stable fmt --manifest-path "$manifest" -- --check
            cargo +stable clippy --locked --manifest-path "$manifest" -- -D warnings
            cargo +stable test --locked --manifest-path "$manifest"
          done
      - name: Verify generation, packaging and distribution
        run: node --test scripts/sdk/*.test.mjs
