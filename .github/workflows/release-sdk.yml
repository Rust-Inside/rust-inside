name: Generate, build and distribute Rust SDKs

on:
  workflow_call:
    inputs:
      manifest:
        description: Path to the API and destination manifest in the caller repository
        type: string
        default: rust-inside.json
      version:
        description: SDK version (defaults to the caller's vX.Y.Z tag)
        type: string
      source_tag:
        description: Existing core vX.Y.Z tag to build when retrying a release
        type: string
      dry_run:
        description: Build the selected SDKs and show their destinations without publishing
        type: boolean
        default: false
    secrets:
      tools_token:
        description: Token with Contents read access to the Rust Inside tools repository
      distribution_token:
        description: Token with Contents write access to the destination repositories

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
      repositories: ${{ steps.generate.outputs.repositories || steps.plan.outputs.repositories }}
      backend: ${{ steps.generate.outputs.backend || steps.plan.outputs.backend }}
      matrix: ${{ steps.generate.outputs.matrix || steps.plan.outputs.matrix }}
      has_packages: ${{ steps.generate.outputs.has_packages || steps.plan.outputs.has_packages }}
      build_jvm: ${{ steps.generate.outputs.build_jvm || steps.plan.outputs.build_jvm }}
      build_flutter: ${{ steps.generate.outputs.build_flutter || steps.plan.outputs.build_flutter }}
    steps:
      - name: Select the existing core tag for a retry
        id: retry
        if: inputs.source_tag != ''
        env:
          TAG: ${{ inputs.source_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "source_tag must be a vX.Y.Z tag." >&2
            exit 1
          fi
          if [[ -n "$VERSION" && "$VERSION" != "${TAG#v}" ]]; then
            echo "version must match source_tag." >&2
            exit 1
          fi
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Check out the caller's Rust project
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.retry.outputs.ref || github.sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - name: Record the core commit for all builds
        id: source
        working-directory: source
        run: |
          sha=$(git rev-parse --verify 'HEAD^{commit}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the matching Rust Inside tools
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: &tools-token ${{ secrets.tools_token || secrets.RUST_INSIDE_TOOLS_TOKEN || github.token }}
          path: rust-inside
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Select packages from the configured repositories
        id: plan
        working-directory: source
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: node ../rust-inside/scripts/sdk/release-info.mjs --plan "$MANIFEST"
      - name: Resolve the release version
        id: release
        if: steps.plan.outputs.has_packages == 'true'
        env:
          VERSION: ${{ steps.retry.outputs.version || inputs.version }}
        run: |
          if [[ -z "$VERSION" && "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a vX.Y.Z tag or pass an explicit X.Y.Z version." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - &configure-cargo
        name: Configure Cargo access to the Rust Inside annotations
        env:
          TOOLS_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          git config --global "credential.$GITHUB_SERVER_URL.useHttpPath" true
          git config --global --add "credential.$GITHUB_SERVER_URL.helper" '!bash "$GITHUB_WORKSPACE/rust-inside/scripts/sdk/tools-credential.sh"'
          echo "RUST_INSIDE_TOOLS_REPOSITORY=$TOOLS_REPOSITORY" >> "$GITHUB_ENV"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - name: Generate the SDK bindings and resolve the shared Cargo.lock
        id: generate
        if: steps.plan.outputs.has_packages == 'true'
        working-directory: source
        env:
          MANIFEST: ${{ inputs.manifest }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REF: ${{ steps.retry.outputs.ref || github.ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUST_INSIDE_TOOLS_TOKEN: *tools-token
        run: |
          node ../rust-inside/scripts/sdk/generate.mjs "$MANIFEST" ../generated
          GITHUB_REF="$SOURCE_REF" GITHUB_SHA="$SOURCE_SHA" node ../rust-inside/scripts/sdk/release-info.mjs ../generated/sdk.json
      - if: steps.generate.outputs.has_packages == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: generated-bindings
          path: generated/
          if-no-files-found: error
          overwrite: true

  build:
    needs: generate
    if: needs.generate.outputs.has_packages == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.generate.outputs.version }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.generate.outputs.source_sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: *tools-token
          path: rust-inside
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: generated-bindings
          path: generated/
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - *configure-cargo
      - name: Install target standard libraries for the project's Rust toolchain
        if: matrix.targets
        run: rustup target add ${{ matrix.targets }}
      - if: matrix.platform == 'js'
        run: bash ../rust-inside/scripts/sdk/install-wasm-bindgen.sh
      - if: matrix.platform == 'js'
        env: &cargo-auth
          RUST_INSIDE_TOOLS_TOKEN: *tools-token
        run: bash ../rust-inside/scripts/sdk/build-js.sh ../generated "$VERSION" "$RUNNER_TEMP/packages"
      - if: matrix.platform == 'ios'
        env: *cargo-auth
        run: bash ../rust-inside/scripts/sdk/build-apple.sh ../generated "$VERSION" "$RUNNER_TEMP/packages/ios"
      - name: Build the JVM native library for this runner
        if: matrix.jvm_native
        env: *cargo-auth
        run: bash ../rust-inside/scripts/sdk/build-jvm-native.sh ../generated "$RUNNER_TEMP/jvm-natives"
      - if: matrix.jvm_native
        uses: actions/upload-artifact@v6
        with:
          name: jvm-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/jvm-natives/
          if-no-files-found: error
          overwrite: true
      - if: matrix.platform == 'android' || matrix.platform == 'flutter-android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - if: matrix.platform == 'android'
        env: *cargo-auth
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.1.13356709' 'platforms;android-36' 'build-tools;35.0.0'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.1.13356709"
          bash ../rust-inside/scripts/sdk/build-android.sh ../generated "$VERSION" "$RUNNER_TEMP/packages/android"
      - if: matrix.platform == 'flutter-ios'
        env: *cargo-auth
        run: bash ../rust-inside/scripts/sdk/flutter-build.sh ../generated/platforms/flutter ios "$RUNNER_TEMP/flutter-natives"
      - if: matrix.platform == 'flutter-android'
        env: *cargo-auth
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.1.13356709'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.1.13356709"
          bash ../rust-inside/scripts/sdk/flutter-build.sh ../generated/platforms/flutter android "$RUNNER_TEMP/flutter-natives"
      - if: startsWith(matrix.platform, 'flutter-')
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/flutter-natives/
          if-no-files-found: error
          overwrite: true
      - if: matrix.platform == 'js' && needs.generate.outputs.backend == 'node' && fromJSON(needs.generate.outputs.repositories).backend
        uses: actions/upload-artifact@v6
        with:
          name: rust-inside-backend
          path: ${{ runner.temp }}/packages/backend/
          if-no-files-found: error
          overwrite: true
      - if: matrix.platform == 'js' && fromJSON(needs.generate.outputs.repositories).web
        uses: actions/upload-artifact@v6
        with:
          name: rust-inside-web
          path: ${{ runner.temp }}/packages/web/
          if-no-files-found: error
          overwrite: true
      - if: matrix.platform == 'ios' || matrix.platform == 'android'
        uses: actions/upload-artifact@v6
        with:
          name: rust-inside-${{ matrix.platform }}
          path: ${{ runner.temp }}/packages/${{ matrix.platform }}/
          if-no-files-found: error
          overwrite: true

  jvm:
    needs: [generate, build]
    if: needs.generate.outputs.build_jvm == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.generate.outputs.source_sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: *tools-token
          path: rust-inside
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: generated-bindings
          path: generated/
      - uses: actions/download-artifact@v7
        with:
          pattern: jvm-native-*
          merge-multiple: true
          path: ${{ runner.temp }}/jvm-natives/
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - *configure-cargo
      - name: Assemble the Kotlin/JVM JAR with all native libraries
        working-directory: source
        env:
          VERSION: ${{ needs.generate.outputs.version }}
          RUST_INSIDE_TOOLS_TOKEN: *tools-token
        run: |
          bash ../rust-inside/scripts/sdk/build-jvm.sh ../generated "$VERSION" \
            "$RUNNER_TEMP/jvm-natives" "$RUNNER_TEMP/backend" linux-x86-64 linux-aarch64 darwin-aarch64
      - uses: actions/upload-artifact@v6
        with:
          name: rust-inside-backend
          path: ${{ runner.temp }}/backend/
          if-no-files-found: error
          overwrite: true

  flutter:
    needs: [generate, build]
    if: needs.generate.outputs.build_flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: *tools-token
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: generated-bindings
          path: ${{ runner.temp }}/generated/
      - uses: actions/download-artifact@v7
        with:
          pattern: native-flutter-*
          merge-multiple: true
          path: ${{ runner.temp }}/flutter-natives/
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Package and check the Flutter dependency
        env:
          VERSION: ${{ needs.generate.outputs.version }}
        run: |
          node scripts/sdk/flutter-package.mjs "$RUNNER_TEMP/generated/platforms/flutter" "$VERSION" "$RUNNER_TEMP/flutter-natives" "$RUNNER_TEMP/flutter-release"
          bash scripts/sdk/tests/consumer-flutter.sh "$RUNNER_TEMP/generated/platforms/flutter" "$RUNNER_TEMP/flutter-release/flutter-package" "$VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: rust-inside-flutter
          path: ${{ runner.temp }}/flutter-release/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [generate, build, jvm, flutter]
    if: >-
      ${{ !cancelled() && needs.generate.result == 'success' && needs.build.result == 'success' &&
          (needs.jvm.result == 'success' || (needs.jvm.result == 'skipped' && needs.generate.outputs.build_jvm == 'false')) &&
          (needs.flutter.result == 'success' || (needs.flutter.result == 'skipped' && needs.generate.outputs.build_flutter == 'false')) }}
    uses: ./.github/workflows/distribute.yml
    with:
      version: ${{ needs.generate.outputs.version }}
      source_sha: ${{ needs.generate.outputs.source_sha }}
      backend: ${{ needs.generate.outputs.backend }}
      backend_repository: ${{ fromJSON(needs.generate.outputs.repositories).backend || '' }}
      ios_repository: ${{ fromJSON(needs.generate.outputs.repositories).ios || '' }}
      android_repository: ${{ fromJSON(needs.generate.outputs.repositories).android || '' }}
      web_repository: ${{ fromJSON(needs.generate.outputs.repositories).web || '' }}
      flutter_repository: ${{ fromJSON(needs.generate.outputs.repositories).flutter || '' }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      tools_token: *tools-token
      distribution_token: ${{ secrets.distribution_token || secrets.RUST_INSIDE_RELEASE_TOKEN }}
