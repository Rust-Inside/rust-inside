name: Release SDKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Build and check this version without publishing (X.Y.Z)
        type: string
        required: true
        default: '0.0.0'

permissions:
  contents: read

jobs:
  release:
    uses: Rust-Inside/rust-inside/.github/workflows/release-sdk.yml@main
    with:
      version: ${{ inputs.version || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      tools_token: ${{ secrets.RUST_INSIDE_TOOLS_TOKEN }}
      distribution_token: ${{ secrets.RUST_INSIDE_RELEASE_TOKEN }}
